<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/doctor.css">
    <link rel="stylesheet" href="css/responsive.css">
    <title>HealthCare+ | Doctors</title>
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="images/logo.jpeg" title="Logo" alt="HealthCare+ Logo">
                <span>HealthCare+</span>
            </div>

            <button id="menuToggle" class="menu-toggle" aria-label="Toggle Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav-links">
                <a href="index.html" title="Home">
                    <img src="images/icon/home.jpeg" title="Home" alt="Home Icon" class="nav-icon">
                    Home
                </a>
                <a href="doctors.html" class="active" title="Doctors">
                    <img src="images/icon/doctors.jpeg" title="Doctors" alt="Doctors Icon" class="nav-icon">
                    Doctors
                </a>
                <a href="appointment.html" title="Appointments">
                    <img src="images/icon/appointments.jpeg" title="Appointments" alt="Appointments Icon" class="nav-icon">
                    Appointment
                </a>
                <a href="about.html" title="About">
                    <img src="images/icon/about.jpeg" title="About" alt="About Icon" class="nav-icon">
                    About
                </a>
                <a href="contact.html" title="Contact">
                    <img src="images/icon/contact.jpeg" title="Contact" alt="Contact Icon" class="nav-icon">
                    Contact
                </a>
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle Dark Mode">🌙</button>
            </nav>
        </div>
    </header>

    <section class="page-heading">
        <h1>Our Doctors</h1>
        <p>Browse our team of experienced specialists</p>
    </section>

    <section class="filter-search-section">
        <div class="filter-buttons">
            <button class="filter-btn active" title="All" data-specialization="All">All</button>
            <button class="filter-btn" title="Cardiologist" data-specialization="Cardiologist">Cardiologist</button>
            <button class="filter-btn" title="Orthopedic" data-specialization="Orthopedic">Orthopedic</button>
            <button class="filter-btn" title="Neurologist" data-specialization="Neurologist">Neurologist</button>
            <button class="filter-btn" title="Pediatrician" data-specialization="Pediatrician">Pediatrician</button>
            <button class="filter-btn" title="Favourites" data-specialization="Favourites">💖 Favourites</button>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search doctor by name...">
        </div>
    </section>

    <section class="doctors-section">
        <div id="loadingSpinner" class="spinner"></div>
        <div id="doctorsContainer" class="doctors-grid hidden"></div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 HealthCare+. All rights reserved.</p>
    </footer>
    <script src="js/main.js"></script>
    <script src="js/doctorsData.js"></script>
    <script src="js/history.js"></script>
    <script src="js/remainder.js"></script>
    <script src="js/favourites.js"></script>
    <script src="js/doctors.js"></script>
    <script src="js/filter.js"></script>
</body>
</html>
